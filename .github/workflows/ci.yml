name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and run all tests
        run: ./mvnw -B verify
      - name: Keep test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-jdk${{ matrix.java }}
          path: target/surefire-reports/

  real-run:
    name: Real-run validation (packaged jar, JDK 17)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Package
        run: ./mvnw -B -q -DskipTests package
      - name: Demo (one task per failure mode)
        run: scripts/demo.sh
      - name: Load test and backpressure
        run: scripts/load-test.sh
      - name: kill -9 during submission
        run: scripts/crash-test.sh
      - name: SIGTERM graceful shutdown
        run: scripts/shutdown-test.sh
      - name: Keep app logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-run-logs
          path: run/**/app.log

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build, run, stop, restart
        run: scripts/docker-smoke.sh
